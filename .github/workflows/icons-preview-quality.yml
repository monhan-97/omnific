name: Docs preview

on:
  pull_request:
    paths:
      - packages/icons/**
      - packages/atelier/**
      - .storybook/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/icons-preview-quality.yml
  push:
    branches:
      - main
    paths:
      - packages/icons/**
      - packages/atelier/**
      - .storybook/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/icons-preview-quality.yml

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Test packages
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Test icons preview
        run: pnpm --dir packages/icons docs:test

      - name: Lint icons preview
        run: pnpm --dir packages/icons docs:lint

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Build icons preview
        run: pnpm --dir packages/icons docs:build

      - name: Build Atelier Storybook
        run: pnpm build:storybook

      - name: Assemble Pages artifact
        run: |
          rm -rf pages-artifact
          mkdir -p pages-artifact/atelier
          cp -R packages/icons/docs/build/. pages-artifact/
          cp -R packages/atelier/storybook-static/. pages-artifact/atelier/

      - name: Verify Pages artifact
        run: |
          set -euo pipefail
          test -f pages-artifact/index.html
          test -f pages-artifact/atelier/index.html
          # 禁止指向站点根的绝对静态资源（相对路径或 /omnific/ 子路径才可在 Pages 下解析）
          if grep -E '(href|src)="/' pages-artifact/index.html pages-artifact/atelier/index.html | grep -v '/omnific/'; then
            echo 'Absolute root asset references are not portable on GitHub Pages.'
            exit 1
          fi
          echo 'Verified Pages artifact: icons + atelier entries.'
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
